<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Book Browser Web Application</title>
  <link rel="stylesheet" href="styles/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Style+Script&display=swap" rel="stylesheet">
</head>
<body>
  <!-- HEADER -->
  <header class="header">
    <h1>Book Browser Web Application</h1>
    <p>Find books by title, genre, and more.</p>
  </header>
  <!-- SEARCH + FILTERS -->
  <section class="controls">
    <!-- SEARCH INPUT -->
    <input
      type="text"
      id="searchInput"
      placeholder="Search books by title..."
    >
    <!-- CATEGORY FILTERS -->
    <select id="categoryFilter">
      <option value="all">All Categories</option>
      <option value="Fantasy">Fantasy</option>
      <option value="Sci-Fi">Sci-Fi</option>
      <option value="Mystery">Mystery</option>
      <option value="Romance">Romance</option>
      <option value="Nonfiction">Nonfiction</option>
      <option value="Fiction">Fiction</option>
    </select>
  <!-- DARK MODE WRAPPER -->
  <div class="theme-controls">
    <button id="darkModeToggle">Dark Mode</button>
  </div>
</section>
  </section>
  <!-- BOOK LIST -->
  <main>
    <!-- JAVASCRIPT BOOK RENDERS -->
    <section id="bookContainer" class="book-container">
    </section>
    <!-- BOOK DETAILS -->
    <section id="bookDetails" class="book-details">
      <h2>Select a Book</h2>
      <p>Click a book card to see more details.</p>
    </section>
  </main>
  <!-- FOOTER -->
  <footer class="footer">
    <p>Amanda McIntire | AI Centric Software Engineering Bootcamp | Book Browser Web Application</p>
  </footer>
  <script src="js/script.js"></script>
</body>
</html>
